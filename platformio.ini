[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

upload_speed = 921600

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit BusIO
    madhephaestus/ESP32Servo
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -DCORE_DEBUG_LEVEL=3
